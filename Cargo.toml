[package]
name = "noyalib-mcp"
version = "0.0.34"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "Model Context Protocol server exposing noyalib's lossless YAML editing to AI agents"
repository = "https://github.com/sebastienrousseau/noyalib-mcp"
homepage = "https://github.com/sebastienrousseau/noyalib-mcp"
documentation = "https://docs.rs/noyalib-mcp"
readme = "README.md"
keywords = ["yaml", "mcp", "ai", "claude", "tooling"]
categories = ["command-line-utilities", "encoding"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[lib]
name = "noyalib_mcp"
path = "src/lib.rs"

[[bin]]
name = "noyalib-mcp"
path = "src/main.rs"

[dependencies]
# Strict-lockstep versioning (ADR-0005). Dependabot ignores this
# dep; bumps are coordinated with the parent noyalib release tag.
noyalib = { version = "=0.0.34", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "mcp_tools"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# ── Pre-release resolution ─────────────────────────────────────────
# The `=0.0.34` lockstep pin resolves only against the *published*
# core. Until that release lands on crates.io, resolve it from the
# core's release branch so CI and local builds work. REMOVE at the
# v0.0.34 cut — the release validation must refuse to tag while this
# section is present.
[patch.crates-io]
noyalib = { git = "https://github.com/sebastienrousseau/noyalib", branch = "feat/v0.0.34" }
