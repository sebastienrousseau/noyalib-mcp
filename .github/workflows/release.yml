name: Release

# Satellite multi-channel release. On tag push:
#   tag-signature → validate → artifacts (.crate + SBOM)
#                            → sign (SLSA L3 + sigstore + GPG)
#                            → reproducible
#                            → cross-verify
#                 → github-release
#                 → { crates-io, npm-publish, container-publish → mcp-registry }
#
# Uses the same permissions + attestation pattern as the parent
# noyalib. Strict-lockstep versioning (ADR-0005) is enforced by
# the `validate` job — the tag must match Cargo.toml's version AND
# the `noyalib = "=X.Y.Z"` pin.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish steps)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # ── Release tag: annotated, signed, by the release key ─────────────
  # Shared with every crate in the family (shared-tag-signature.yml):
  # the tag must be annotated, verified by GitHub, made by the release
  # identity on the commit being built, and signed by a pinned key.
  # Passes without checking on a workflow_dispatch dry run.
  tag-signature:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-tag-signature.yml@139a826ba273b8f9feffff54795711f4df321928

  # ── Quality gate ────────────────────────────────────────────────────
  validate:
    name: Validate
    needs: tag-signature
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy

      # CACHE-POISONING GUARD: isolated CARGO_TARGET_DIR so a stale
      # PR-build fingerprint can never mask a release regression.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning] test-only job: nothing it builds ships, and the key is written only by tag runs of this workflow
          workspaces: ". -> target-release-validate"
          key: release-validate

      - name: Quality checks
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-release-validate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --locked
          cargo doc --no-deps --all-features --locked

      - name: Verify tag matches Cargo.toml + noyalib pin
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          NOYALIB_PIN=$(grep -E '^noyalib\s*=' Cargo.toml | head -1 | sed 's/.*"=\?\([0-9.]*\)".*/\1/')
          if [ "$NOYALIB_PIN" != "$CARGO_VERSION" ]; then
            echo "::error::noyalib dep pin ($NOYALIB_PIN) is out of lockstep with noyalib-mcp ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: tag=$TAG_VERSION, crate=$CARGO_VERSION, noyalib pin=$NOYALIB_PIN"

      - name: Verify server.json + glama.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SERVER_VERSION=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          GLAMA_VERSION=$(python3 -c 'import json; print(json.load(open("glama.json"))["version"])')
          for pair in "server.json:$SERVER_VERSION" "glama.json:$GLAMA_VERSION"; do
            file="${pair%%:*}"
            v="${pair##*:}"
            if [ "$v" != "$TAG_VERSION" ]; then
              echo "::error::$file version ($v) does not match tag ($TAG_VERSION)"
              exit 1
            fi
          done
          echo "Registry manifests aligned: server.json=$SERVER_VERSION, glama.json=$GLAMA_VERSION"

  # ── Build .crate + SBOM (the `sign` job signs them) ─────────────────
  artifacts:
    name: Build artifacts
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      # No build cache here: this job produces what ships. A restored
      # ~/.cargo/registry/src or target/ is not re-verified against
      # Cargo.lock, so a poisoned cache entry would flow into the
      # release (zizmor cache-poisoning). Release builds start clean.

      # Everything else that carries the version. Added after v0.0.28,
      # where noyalib-mcp's registry manifests were missed and the
      # mismatch surfaced only after the tag was pushed. Runnable
      # locally before tagging: scripts/verify-release-versions.sh
      - name: Verify every version-bearing file agrees
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/verify-release-versions.sh "${GITHUB_REF_NAME}"

      - name: Package crate
        run: cargo package --all-features --allow-dirty

      - name: Generate SBOM
        run: |
          set -euo pipefail
          # Human-readable dependency listing (kept for reviewers) …
          cargo tree --edges normal --prefix depth --format '{p} {l}' > SBOM.txt
          # … and the machine-readable SBOM procurement pipelines
          # ingest — `cargo tree > txt` is not an SBOM format.
          # Mirrors the core repo's release pipeline; `--all-features`
          # records the superset dependency graph.
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo cyclonedx --format json --all-features --describe crate --spec-version 1.5
          mv ./*.cdx.json SBOM.cdx.json
          python3 -c "import json; d=json.load(open('SBOM.cdx.json')); print('CycloneDX', d['specVersion'], '-', d['metadata']['component']['name'], d['metadata']['component']['version'], '-', len(d.get('components', [])), 'components')"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd target/package
          : > SHA256SUMS.txt
          : > SHA512SUMS.txt
          for f in *.crate; do
            sha256sum "$f" >> SHA256SUMS.txt
            sha512sum "$f" >> SHA512SUMS.txt
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            target/package/*.crate
            target/package/SHA256SUMS.txt
            target/package/SHA512SUMS.txt
            SBOM.txt
            SBOM.cdx.json
          retention-days: 5

  # ── Sign release artefacts (isolated from the build) ───────────────
  # Attestation, keyless signing and the detached GPG signatures run in
  # their own job, which downloads the finished artefacts and executes
  # nothing from the source tree or its dependency graph. Until v0.0.56
  # they ran in `artifacts`, after `cargo package` and `cargo install`
  # had executed every build script in the graph; a build script can
  # append to $GITHUB_ENV and read later steps' environment, including
  # GPG_PRIVATE_KEY and the OIDC signing identity.
  #
  # GPG_PRIVATE_KEY and GPG_PASSPHRASE belong to the `release-signing`
  # environment, which only `v*` tags may deploy to. Tag runs only: a
  # workflow_dispatch dry run builds and verifies but signs nothing.
  sign:
    name: Sign release artefacts
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      # `id-token: write`: Fulcio keyless signing and the SLSA
      #   provenance attestation exchange the job's OIDC token.
      # `attestations: write`: provenance lands in the attestation store.
      id-token: write
      attestations: write
    steps:
      - name: Download the unsigned release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/package/*.crate
            SBOM.txt
            SBOM.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artefacts (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd target/package
          for f in *.crate; do
            cosign sign-blob --bundle "${f}.bundle" "$f"
          done
          cd -
          cosign sign-blob --bundle "SBOM.txt.bundle" SBOM.txt
          cosign sign-blob --bundle "SBOM.cdx.json.bundle" SBOM.cdx.json

      # ── Optional detached GPG signatures ──────────────────────────
      # Additive to the sigstore bundles above, not a replacement.
      # Keyless signing is the stronger primitive — no long-lived key to
      # guard, and every signature is publicly logged in Rekor — but it
      # requires cosign and network access to verify. A detached `.asc`
      # can be checked with the gpg any distro already ships, offline,
      # which is what package maintainers and air-gapped consumers ask
      # for.
      #
      # A step in the separate `sign` job since v0.0.56 (it used to be a
      # step in `artifacts`, next to the build). It still cannot lose a
      # race with the release: `github-release` needs this job and
      # attaches only what it uploads as `release-signed`, so the `.asc`
      # files exist before the artifact the release reads.
      # static-site-generator learned the hard way what happens
      # otherwise: its signing job ran concurrently with publishing, so
      # the signatures were generated, stored, and dropped before the
      # release was assembled (sebastienrousseau/static-site-generator#678).
      #
      # Absent secret = skip, not fail. Every release before this one
      # shipped without GPG, and a fork without the key must still be
      # able to cut a release.
      - name: GPG sign release artefacts (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY not set — skipping detached signatures."
            echo "The sigstore bundles above are unaffected."
            exit 0
          fi

          # Import into a throwaway keyring inside the runner workspace
          # so nothing persists and GNUPGHOME never points at a shared
          # location.
          # Declared separately from the assignment so a mktemp failure
          # is not masked by export's own exit status (SC2155).
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "signing with ${KEY_ID}"

          # Trust the key ultimately *in this throwaway keyring*. A fresh
          # GNUPGHOME has no ownertrust database, so `gpg --verify` would
          # otherwise report a perfectly good signature as
          # "not certified with a trusted signature". That warning is not
          # cosmetic here: without it the verification below cannot
          # distinguish our key from any other key that happens to
          # produce a valid signature.
          printf '%s:6:\n' "$KEY_ID" | gpg --batch --quiet --import-ownertrust

          sign() {
            gpg --batch --yes --quiet \
                --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE:-}" \
                --local-user "$KEY_ID" \
                --armor --detach-sign "$1"

            # Verify what we just wrote, and assert three things rather
            # than trusting the exit status. `gpg --verify` returns 0 for
            # a valid signature from an *untrusted* key, so the exit code
            # alone does not say what a reader assumes it says.
            #
            #   GOODSIG    the signature is cryptographically valid
            #   VALIDSIG   it was made by THIS key, not merely some key
            #   TRUST_*    the key is certified, not dangling
            local status
            status="$(mktemp)"
            gpg --batch --status-fd=1 --verify "$1.asc" "$1" >"$status" 2>/dev/null
            grep -q '^\[GNUPG:\] GOODSIG'                  "$status" || { echo "::error::$1: signature is not GOODSIG";  sed 's/^/    /' "$status"; exit 1; }
            grep -q "^\[GNUPG:\] VALIDSIG ${KEY_ID}"       "$status" || { echo "::error::$1: not signed by ${KEY_ID}";   sed 's/^/    /' "$status"; exit 1; }
            grep -qE '^\[GNUPG:\] TRUST_(ULTIMATE|FULLY)'  "$status" || { echo "::error::$1: key is not trusted";        sed 's/^/    /' "$status"; exit 1; }
            rm -f "$status"
            echo "  signed + verified (GOODSIG, VALIDSIG ${KEY_ID}, trusted) $1"
          }

          for f in target/package/*.crate; do sign "$f"; done
          sign SBOM.txt
          sign SBOM.cdx.json

          gpgconf --kill all || true
          rm -rf "$GNUPGHOME"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: |
            target/package/*.crate
            target/package/*.bundle
            target/package/SHA256SUMS.txt
            target/package/SHA512SUMS.txt
            SBOM.txt
            SBOM.txt.bundle
            SBOM.cdx.json
            SBOM.cdx.json.bundle
            target/package/*.asc
            SBOM.txt.asc
            SBOM.cdx.json.asc
          retention-days: 5

  # ── Independent reproducibility gate ───────────────────────────────
  # Rebuilds every .crate from a fresh checkout and requires the bytes
  # the `artifacts` job produced (shared-reproducible-package.yml).
  reproducible:
    needs: artifacts
    uses: sebastienrousseau/noyalib/.github/workflows/shared-reproducible-package.yml@139a826ba273b8f9feffff54795711f4df321928
    with:
      package-args: --all-features --allow-dirty

  # ── Cross-platform verification ─────────────────────────────────────
  # MCP is stdio-JSON-RPC; the process-lifecycle + IPC surface differs
  # across host OSes (line endings, path separators, signal handling),
  # so the full triad matters here.
  cross-verify:
    name: Verify (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-release-verify-${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning] test-only job: nothing it builds ships, and the key is written only by tag runs of this workflow
          workspaces: ". -> target-release-verify-${{ matrix.os }}"
          key: release-verify-${{ matrix.os }}
      - run: cargo test --all-features --locked

  # ── Per-target binaries for the npm wrapper ─────────────────────────
  # The wrapper (pkg/npm-wrapper) runs a binary only when its package
  # carries the SHA-256 of the archive and of the binary for the
  # platform; npm-publish writes those into digests.json from these.
  npm-binaries:
    name: Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="noyalib-mcp-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          BIN=noyalib-mcp
          [ "${{ matrix.ext }}" = zip ] && BIN=noyalib-mcp.exe
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/$BIN" LICENSE-MIT LICENSE-APACHE README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$NAME.zip" "$NAME" > /dev/null; else tar -czf "$NAME.tar.gz" "$NAME"; fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/noyalib-mcp-*.${{ matrix.ext }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-binary-${{ matrix.target }}
          path: dist/noyalib-mcp-*.${{ matrix.ext }}
          if-no-files-found: error

  # ── GitHub Release ──────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [sign, reproducible, cross-verify, npm-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: artifacts

      - name: Download the npm wrapper's binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-binary-*
          path: artifacts/npm
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a re-tag/re-run may find the release already
          # created (gh release create errors on an existing tag). Drop it
          # first — keeping the git tag — so the create below succeeds.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          # Built as an array under `nullglob` so the .asc entries simply
          # vanish when GPG signing was skipped, instead of reaching gh as
          # unmatched literal globs and failing the release.
          #
          # The .asc files were produced, uploaded to the workflow artifact,
          # and then dropped here: this list is explicit and did not name
          # them. Same outcome as
          # sebastienrousseau/static-site-generator#678, reached from the
          # opposite direction — there a glob raced the signing job, here an
          # explicit list omitted its output.
          shopt -s nullglob
          assets=(
            artifacts/target/package/*.crate
            artifacts/target/package/*.bundle
            artifacts/target/package/*.asc
            artifacts/target/package/SHA256SUMS.txt
            artifacts/target/package/SHA512SUMS.txt
            artifacts/SBOM.txt
            artifacts/SBOM.txt.bundle
            # The `[c]` character class makes these actual globs:
            # `nullglob` only removes unmatched *patterns*, so the
            # previous literal spelling stayed in the array when GPG
            # signing was skipped and failed `gh release create` on a
            # missing file. Mirrors the core repo's fix.
            artifacts/SBOM.txt.as[c]
            artifacts/SBOM.cdx.json
            artifacts/SBOM.cdx.json.bundle
            artifacts/SBOM.cdx.json.as[c]
            artifacts/npm/noyalib-mcp-*.tar.gz
            artifacts/npm/noyalib-mcp-*.zip
          )
          shopt -u nullglob
          printf 'attaching %s\n' "${assets[@]}"
          # Release page in the house shape: hand-written Highlights kept
          # in the repository, GitHub's generated What's Changed, and a
          # SHA-256 of every asset attached. The Highlights file is
          # required; the version gate checks for it before the tag.
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "::error::$NOTES is missing; every release needs hand-written Highlights"; exit 1; }
          PREV_TAG=$(git tag --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          GEN=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} --jq .body \
            | sed '/^\*\*Full Changelog\*\*/d')
          if ! printf '%s\n' "$GEN" | grep -q "^## What's Changed"; then
            # No pull request behind this tag: list its commits in the same shape.
            GEN=$(printf "## What's Changed\n"; gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | tail -1)}...${GITHUB_REF_NAME}" \
              --jq '.commits[] | "* \(.commit.message | split("\n")[0]) by @\(.author.login // .commit.author.name) in \(.html_url)"')
          fi
          {
            awk '/^## Highlights/{p=1} p && /^## / && !/^## Highlights/{exit} p' "$NOTES"
            echo
            printf '%s\n' "$GEN"
            echo
            echo "## Checksums"
            echo
            echo "SHA-256 of every asset attached to this release:"
            echo
            echo '```text'
            for f in "${assets[@]}"; do printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"; done | sort -k2
            echo '```'
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" \
            --title "noyalib-mcp ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

  # ── Publish to crates.io ────────────────────────────────────────────
  crates-io:
    name: Publish to crates.io
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Mints the OIDC identity token crates.io exchanges for a
      # short-lived publish token. Without it the auth step fails.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. Needs a trusted publisher registered on crates.io
      # for this crate (repo + release.yml + environment crates-io).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -uxo pipefail
          # --no-verify: `cargo package` in `artifacts` already compiled
          # the packaged sources, and `reproducible` proved this tag
          # packages to the same bytes. Verifying again here would run
          # every dependency's build script in the one job that holds
          # the crates.io publish token.
          out=$(cargo publish --all-features --locked --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "$out" | grep -qE 'already (exists|uploaded)' \
              && { echo "version already on crates.io — tolerating"; exit 0; }
            exit "$rc"
          fi

  # ── Publish npm wrapper ─────────────────────────────────────────────
  npm-publish:
    name: Publish npm wrapper
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC + --provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC Trusted Publishing for the publish (not just provenance)
      # requires npm >= 11.5.1. Node 24 ships a newer npm; assert it rather
      # than run an unpinned `npm install -g npm@latest` (Scorecard flags
      # any npm install without a lockfile as an unpinned dependency).
      - name: Assert npm supports OIDC Trusted Publishing (>= 11.5.1)
        run: |
          # shellcheck disable=SC2016 # single-quoted JavaScript, not shell
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [a, b, c] = v.split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            console.log(`npm ${v}: ${ok ? "supports" : "does NOT support"} OIDC trusted publishing`);
            if (!ok) process.exit(1);'

      - name: Sync wrapper version to tag
        working-directory: pkg/npm-wrapper
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version --ignore-scripts "$TAG_VERSION"

      - name: Download the binaries the release attached
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-binary-*
          path: npm-binaries
          merge-multiple: true

      # digests.json is what the wrapper trusts: the SHA-256 of each
      # archive and of the binary inside it, for every target the
      # wrapper maps a platform to. A target with no archive fails the
      # release here rather than on a user's machine.
      - name: Write digests.json
        working-directory: pkg/npm-wrapper
        run: |
          set -euo pipefail
          node - "${GITHUB_REF_NAME#v}" "$GITHUB_WORKSPACE/npm-binaries" <<'EOF'
          const fs = require("node:fs"), path = require("node:path"), os = require("node:os");
          const crypto = require("node:crypto"), { execFileSync } = require("node:child_process");
          const [version, dir] = process.argv.slice(2);
          const src = fs.readFileSync("bootstrap.js", "utf8");
          const triples = [...src.matchAll(/"[a-z0-9]+-[a-z0-9]+":\s+"([^"]+)"/g)].map((m) => m[1]);
          const sha = (b) => crypto.createHash("sha256").update(b).digest("hex");
          const find = (d, n) => {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const f = path.join(d, e.name);
              if (e.isFile() && e.name === n) return f;
              if (e.isDirectory()) { const r = find(f, n); if (r) return r; }
            }
          };
          const targets = {};
          for (const t of triples) {
            const zip = t.includes("windows");
            const archive = `noyalib-mcp-${version}-${t}.${zip ? "zip" : "tar.gz"}`;
            const file = path.join(dir, archive);
            if (!fs.existsSync(file)) throw new Error(`no release archive for ${t}: ${archive}`);
            const work = fs.mkdtempSync(path.join(os.tmpdir(), "digest-"));
            // GNU tar on the runner cannot read a .zip; use unzip for those.
            if (zip) execFileSync("unzip", ["-q", file, "-d", work]);
            else execFileSync("tar", ["-xf", file, "-C", work]);
            const bin = find(work, zip ? "noyalib-mcp.exe" : "noyalib-mcp");
            if (!bin) throw new Error(`${archive} holds no binary`);
            targets[t] = { archive, archive_sha256: sha(fs.readFileSync(file)), binary_sha256: sha(fs.readFileSync(bin)) };
          }
          fs.writeFileSync("digests.json", JSON.stringify({ version, targets }, null, 2) + "\n");
          console.log(`digests.json: ${Object.keys(targets).length} targets`);
          EOF
          npm test

      - name: Publish (Trusted Publishing + provenance)
        working-directory: pkg/npm-wrapper
        run: |
          set -uxo pipefail
          # Idempotent: a re-tag may find this version already on npm
          # (npm forbids republishing the same version -> E403).
          out=$(npm publish --provenance --access public --ignore-scripts 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "$out" | grep -qiE 'cannot publish over|previously published|already exists' \
              && { echo "version already on npm — tolerating"; exit 0; }
            exit "$rc"
          fi

  # ── Publish GHCR container image ────────────────────────────────────
  container-publish:
    name: Publish GHCR container image
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pkg/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            io.modelcontextprotocol.server.name=io.github.sebastienrousseau/noyalib-mcp
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      - name: Attest container provenance (SLSA L3)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

  # ── Register with the MCP Registry ─────────────────────────────────
  mcp-registry:
    name: Register with MCP Registry
    needs: [container-publish]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange with the MCP Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # The old install-mcp-publisher.sh (raw.githubusercontent … main
          # /scripts/) now 404s — mcp-publisher ships as release binaries.
          # Pin a known-good version for a reproducible, supply-chain-safe
          # download (bump deliberately, not implicitly).
          #
          # The pin alone did not make it safe: the tarball was piped
          # straight into tar in a job holding `id-token: write`.
          # Download to a file and check it against the
          # SHA-256 for this exact asset first. The digest below is the
          # one in upstream's registry_1.7.9_checksums.txt and in the
          # release's asset metadata (both read 2026-10-07); bump the
          # version and the digest together.
          ver="v1.7.9"
          sha256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl -sfL --proto '=https' -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${ver}/${asset}"
          printf '%s  %s\n' "$sha256" "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" mcp-publisher
          sudo install -m0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Publish to MCP Registry
        run: |
          # Authenticate first — `publish` needs a prior login. Use the
          # GitHub Actions OIDC token (job has id-token: write).
          mcp-publisher login github-oidc
          # Idempotent: a re-tag re-run finds the version already
          # registered ("cannot publish duplicate version") — tolerate it.
          out=$(mcp-publisher publish 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "$out" | grep -qi 'duplicate version' \
              && { echo "version already in MCP registry — tolerating"; exit 0; }
            exit "$rc"
          fi
