name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "crates/noyalib-mcp/**"
      - "crates/noyalib-core/**"
      - "crates/noyalib-schema/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/noyalib-mcp/**"
      - "crates/noyalib-core/**"
      - "crates/noyalib-schema/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned like release.yml. dtolnay/rust-toolchain reads the
      # toolchain from the ref name, so a SHA pin must name it explicitly.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target-mcp-inspect"
          key: mcp-inspect

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build noyalib-mcp (release)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-mcp-inspect
        run: cargo build --release -p noyalib-mcp

      - name: List tools via MCP Inspector CLI
        run: |
          BIN="${{ github.workspace }}/target-mcp-inspect/release/noyalib-mcp"
          npx -y @modelcontextprotocol/inspector --cli "$BIN" --method tools/list
