name: MCP Protocol Conformance

# The path filters previously named `crates/noyalib-mcp/**` and
# friends — monorepo paths that do not exist in this standalone
# repo — so the workflow never triggered on any push or PR here.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the audited core for unpublished version branches
        if: startsWith(github.head_ref || github.ref_name, 'feat/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sebastienrousseau/noyalib
          ref: 5b8a1f9ac109e758088fbf24035454d2b6e73f64
          persist-credentials: false
          path: .candidate-core

      - name: Use a local candidate override without changing registry pins
        if: startsWith(github.head_ref || github.ref_name, 'feat/')
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          root = pathlib.Path.cwd()
          core = root / '.candidate-core/crates/noyalib'
          package = tomllib.loads((core / 'Cargo.toml').read_text())['package']
          product = tomllib.loads((root / 'Cargo.toml').read_text())
          dependency = product['dependencies']['noyalib']
          pin = dependency if isinstance(dependency, str) else dependency['version']
          if product['package']['version'] != package['version'] or pin != '=' + package['version']:
              raise SystemExit('candidate core does not match the exact product version')
          config = root / '.cargo/config.toml'
          config.parent.mkdir(exist_ok=True)
          with config.open('x') as stream:
              stream.write('[patch.crates-io]\nnoyalib = { path = ' + json.dumps(str(core)) + ' }\n')
          print('Testing the audited local candidate; registry release gates remain separate.')
          PY

      # SHA-pinned like release.yml. dtolnay/rust-toolchain reads the
      # toolchain from the ref name, so a SHA pin must name it explicitly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target-mcp-inspect"
          key: mcp-inspect

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install and audit the locked Inspector consumer
        run: |
          npm ci --ignore-scripts --prefix tests/inspector
          npm audit --package-lock-only --ignore-scripts --prefix tests/inspector

      - name: Build noyalib-mcp (release)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-mcp-inspect
        run: cargo build --release --locked -p noyalib-mcp

      - name: List tools via MCP Inspector CLI
        run: |
          BIN="${{ github.workspace }}/target-mcp-inspect/release/noyalib-mcp"
          tests/inspector/node_modules/.bin/mcp-inspector --cli "$BIN" --method tools/list --strict
      - name: Refuse changed Cargo locks
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
