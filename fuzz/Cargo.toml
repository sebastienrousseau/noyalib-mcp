[package]
name = "noyalib-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.noyalib-mcp]
path = ".."

[[bin]]
name = "tools"
path = "fuzz_targets/tools.rs"
test = false
doc = false
bench = false

# Pre-release resolution for the parent manifest's exact core pin.
[patch.crates-io]
noyalib = { git = "https://github.com/sebastienrousseau/noyalib", branch = "feat/v0.0.49" }
