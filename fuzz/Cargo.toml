[package]
name = "noyalib-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
axum = { version = "0.8", default-features = false }

[dependencies.noyalib-mcp]
path = ".."

[[bin]]
name = "tools"
path = "fuzz_targets/tools.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_headers"
path = "fuzz_targets/http_headers.rs"
test = false
doc = false
bench = false
